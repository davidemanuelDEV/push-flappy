<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Push Flappy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c122a"/>
      <stop offset="55%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="body" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b5a"/>
      <stop offset="40%" stop-color="#e8453c"/>
      <stop offset="100%" stop-color="#8b1a14"/>
    </radialGradient>
    <radialGradient id="wing" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#fff6e8"/>
      <stop offset="100%" stop-color="#c9925a"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#c49020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- soft copper glow -->
  <circle cx="256" cy="250" r="200" fill="#b87333" opacity="0.22"/>
  <!-- copper pipe hints (side rails, not crowding bird) -->
  <rect x="28" y="80" width="40" height="130" rx="6" fill="#b87333"/>
  <rect x="22" y="198" width="52" height="22" rx="4" fill="#e8a857"/>
  <rect x="28" y="310" width="40" height="130" rx="6" fill="#c47a3a"/>
  <rect x="22" y="298" width="52" height="22" rx="4" fill="#f0c078"/>
  <rect x="444" y="80" width="40" height="130" rx="6" fill="#c47a3a"/>
  <rect x="438" y="198" width="52" height="22" rx="4" fill="#f0c078"/>
  <rect x="444" y="310" width="40" height="130" rx="6" fill="#b87333"/>
  <rect x="438" y="298" width="52" height="22" rx="4" fill="#e8a857"/>
  <!-- bird centered, larger -->
  <g transform="translate(256 268) scale(5.6) translate(-38 -32)">
    <ellipse cx="38" cy="52" rx="22" ry="5" fill="rgba(0,0,0,0.3)"/>
    <ellipse cx="34" cy="32" rx="24" ry="20" fill="url(#body)" stroke="#3b0a08" stroke-width="2.2"/>
    <ellipse cx="38" cy="40" rx="11" ry="9" fill="#e8b48a"/>
    <ellipse cx="26" cy="30" rx="11" ry="8" fill="url(#wing)" stroke="#5c3310" stroke-width="1.6" transform="rotate(-22 26 30)"/>
    <ellipse cx="42" cy="36" rx="5" ry="3.5" fill="rgba(255,120,100,0.45)"/>
    <circle cx="48" cy="24" r="9" fill="#fff" stroke="#1a0a08" stroke-width="1.6"/>
    <circle cx="51" cy="25" r="4" fill="#1a1a1a"/>
    <circle cx="46" cy="21" r="2.2" fill="#fff"/>
    <path d="M38 14 Q48 6 58 16 Q50 12 39 16 Z" fill="#1a0a08"/>
    <path d="M54 30 L74 34 L54 42 Z" fill="url(#beak)" stroke="#7a4e0a" stroke-width="1.3"/>
